spring:
  application:
    name: task-management
  config:
    import: optional:configtree:./vault/
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/task-management}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 1h

logging:
  level:
    com.challenge.aitools.taskmanagement: INFO
