spring:
  application:
    name: task-management
  config:
    # Simulated secret store: every file in ./vault is one property, the file name being the key, the way
    # Vault or Kubernetes mount secrets. It ships a demonstration JWT_SECRET so the application starts
    # with no setup; an environment variable of the same name takes precedence over the file.
    import: optional:configtree:./vault/
  datasource:
    # H2 in file mode, relative to the working directory
    url: ${DB_URL:jdbc:h2:file:./data/task-management}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    # Schema migrations plus the demonstration data
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it
      ddl-auto: validate
  jackson:
    deserialization:
      # A read-only or unknown field in the body is an error, never something to ignore
      fail-on-unknown-properties: true

security:
  jwt:
    # HS256 signing key, at least 32 bytes, with no default: the application does not start without it
    secret: ${JWT_SECRET}
    expiration: 1h

logging:
  level:
    com.challenge.aitools.taskmanagement: INFO
