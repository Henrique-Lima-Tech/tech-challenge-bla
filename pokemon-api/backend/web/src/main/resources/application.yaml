spring:
  application:
    name: challenge
  config:
    import: optional:configtree:./vault/
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/challenge}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    hibernate:
      ddl-auto: validate
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=24h

pokeapi:
  base-url: https://pokeapi.co/api/v2
  max-concurrent-calls: 10

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 1h

logging:
  level:
    com.tech.challenge: INFO
    org.hibernate.orm.jdbc.error: ERROR

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:challenge;DB_CLOSE_DELAY=-1
