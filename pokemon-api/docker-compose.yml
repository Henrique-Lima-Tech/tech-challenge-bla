services:
  backend:
    build: ./backend
    image: tech-challenge-backend
    ports:
      - "8080:8080"
    volumes:
      - h2-data:/app/data
      - ./backend/vault:/app/vault:ro

  frontend:
    build: ./frontend
    image: tech-challenge-frontend
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  h2-data:
